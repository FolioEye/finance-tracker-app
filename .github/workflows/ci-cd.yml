name: FinTrack CI/CD

# ARCHITECTURE NOTE (see docs/adr/ADR-005-deployment-architecture.md):
# Repo is PUBLIC -> environment: production required reviewers works on the free plan.
# Railway is connected to GitHub directly -- it auto-builds apps/api from source on
# push to `staging`/`main`. No GHCR Docker push needed here; this workflow only
# builds and ships the frontend. Railway's own dashboard (one-time setup) owns the
# API build/deploy, not this file.
#
# build-frontend / deploy-frontend-* are guarded on whether apps/web exists yet
# (it doesn't -- only backend stories have shipped so far, FINTRACK-13). That
# check has to happen in its own job with a real checkout: a job-level `if:`
# is evaluated by the orchestrator before any runner/checkout exists for that
# job, so a filesystem-dependent function like hashFiles() isn't available
# there at all (this is what broke the first two attempts at this workflow --
# "Unrecognized function: hashFiles", not a YAML syntax problem). detect-frontend
# below does the actual checkout + shell test and exposes a plain string output,
# which downstream jobs can safely read in their own job-level `if:`.

on:
  push:
    branches: [develop, staging, main]
  pull_request:
    branches: [develop, staging, main]
  workflow_dispatch: # manual trigger only used by generate-lock-file below (F-12)
    inputs:
      upgrade:
        description: "Upgrade all pins to the latest compatible versions (otherwise the lock only changes when requirements.txt does)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # Two runs finishing out of order would race on the gh-pages push and leave
  # the OLDER report published last. cancel-in-progress stays false on
  # purpose: cancelling a half-finished publish is how a site ends up serving
  # a partial report.
  group: allure-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ─── STAGE 0: Detect whether a frontend exists yet ───────────────
  detect-frontend:
    name: Detect Frontend
    runs-on: ubuntu-latest
    outputs:
      exists: ${{ steps.check.outputs.exists }}
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f "apps/web/package.json" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  # ─── STAGE 1: Security scan (all branches) ───────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          severity: CRITICAL,HIGH
          exit-code: 1 # fails pipeline on any CRITICAL or HIGH CVE

  # ─── STAGE 2: Test suite (all branches) ──────────────────────────
  test:
    name: Test Suite
    needs: security-scan
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test_password, POSTGRES_DB: fintrack_test }
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: --health-cmd "redis-cli ping" --health-interval 10s
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20"}
      - name: Install frontend dependencies
        run: cd apps/web && npm install
      - name: Verify requirements.lock.txt is current (F-12)
        # Regenerates a throwaway copy the same way generate-lock-file does and
        # diffs it against the committed lock file. Catches anyone editing
        # apps/api/requirements.txt or requirements-test.txt without also
        # regenerating+committing the lock file -- if this fails, run the
        # "Regenerate requirements.lock.txt (F-12, manual)" job and commit
        # the result.
        #
        # --no-header on both this and generate-lock-file's compile: pip-compile's
        # autogenerated header echoes back its own --output-file argument, which
        # necessarily differs between the committed file (requirements.lock.txt)
        # and this throwaway check copy (requirements.lock.txt.check) -- causing
        # a guaranteed one-line diff even when every dependency and hash matches.
        # Confirmed via the real CI log on 2026-07-21: the only diff was that
        # header line, nothing in the actual lock content. --no-header removes
        # the line entirely so the diff reflects real drift only.
        run: |
          pip install pip-tools
          # Seed the check file from the committed lock BEFORE compiling.
          #
          # pip-compile honours pins already present in its --output-file and
          # only moves them when --upgrade is passed (it minimises churn by
          # design). generate-lock-file compiles into the EXISTING
          # requirements.lock.txt, so it stays anchored to the committed pins.
          # This step used to compile into requirements.lock.txt.check, which
          # does not exist on a fresh runner -- so it resolved UNANCHORED and
          # picked up whatever newest transitive PyPI had. The check was
          # therefore comparing an anchored lock against an unanchored
          # recompile: guaranteed to differ the moment anything upstream
          # released, with no real drift in this repo at all.
          #
          # Confirmed 2026-09-10 (runs 93382921168 / 93387089748): this step
          # failed on anyio 4.14.2 -> 4.15.1 while the manual regen job
          # reported "Everything up-to-date" for the same commit -- so
          # regenerating could never clear it, and every PR was blocked.
          #
          # Seeding makes both compiles start from the same pins, restoring
          # this check's intended meaning: fail only when someone edits
          # requirements.txt without regenerating the lock.
          cp requirements.lock.txt requirements.lock.txt.check
          pip-compile --generate-hashes --allow-unsafe --no-header \
            --output-file=requirements.lock.txt.check \
            apps/api/requirements.txt requirements-test.txt
          # Sorted comparison: pip-compile's hash line order per package can vary
          # between separate compile runs even when content is identical (order
          # depends on how PyPI's JSON API returns file listings, which isn't
          # guaranteed stable) -- a plain `diff` was failing on order alone with
          # no real drift (confirmed 2026-07-28: a fresh manual regen reported
          # "Everything up-to-date" for the same commit this step failed on).
          # Sorting both sides neutralizes ordering and only fails on real content drift.
          diff <(sort requirements.lock.txt) <(sort requirements.lock.txt.check)
      - name: Install dependencies (hash-pinned, F-12)
        # --require-hashes: pip refuses to install anything whose downloaded
        # file doesn't match the hash recorded here, catching a compromised
        # package/mirror even when the version number looks identical.
        run: pip install --require-hashes -r requirements.lock.txt
      - name: Run pytest with coverage
        env:
          # Not actually used by the current suite -- tests/unit, tests/security,
          # and tests/integration all run against an isolated in-memory SQLite DB
          # (see tests/conftest.py) regardless of DATABASE_URL, so results are
          # deterministic and don't depend on this service container. Kept wired
          # up for future stories whose integration tests may want a real Postgres
          # instance.
          DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/fintrack_test
          REDIS_URL: redis://localhost:6379
          JWT_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
          # Without this, `apps` isn't importable and every test module that
          # imports it at module level fails collection with
          # ModuleNotFoundError: No module named 'apps' -- this step never
          # actually ran in real CI until PR #2 (Security Scan always failed
          # first before that), so this gap went uncaught since Release Pro's
          # original workflow was authored. Found via the real CI log, 2026-07-04.
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/unit tests/security tests/integration \
            --cov=apps.api \
            --cov-fail-under=80 \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=html:htmlcov \
            --junitxml=test-results.xml \
            --alluredir=allure-results/api \
            -v
      - name: Upload test & coverage artifacts (F-10)
        # if: always() -- a failing/red run's evidence matters more, not less;
        # QA Lead's envelope should be able to cite this run whether it passed or not.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ github.run_id }}
          path: |
            test-results.xml
            coverage.xml
            htmlcov/
            allure-results/
          retention-days: 30
      - name: Generate SBOM (F-12)
        # CycloneDX SBOM of everything checked out (repo deps, not just apps/api) --
        # syft parses the requirements files directly, no install/interpreter risk.
        # anchore/sbom-action auto-publishes output-file as a build artifact.
        if: always()
        uses: anchore/sbom-action@v0
        with:
          path: .
          format: cyclonedx-json
          output-file: sbom.cdx.json

      - name: Upload Allure results (API suites)
        # Separate from the F-10 upload above: the publish job downloads these
        # on their own. always() keeps a red run's evidence, which is the run
        # whose report matters most.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-api-${{ github.run_id }}
          path: allure-results/api
          retention-days: 30
          if-no-files-found: warn

  # ─── STAGE 2b: E2E browser tier (FINTRACK-65) ────────────────────
  # GATING -- Mr M's decision, 2026-09-19, superseding the report-only phase
  # recorded in ADR-018. A failing browser spec now fails the build.
  #
  # The report-only phase did its job: it carried the tier through the period
  # where every red was the harness rather than the app (a PROD-gated auth seam
  # served from a production bundle, a missing CORS origin, a schema that no
  # migration created, and specs whose seeded session was destroyed by their own
  # next navigation -- FINTRACK-66). Run 95913827332 was the first clean pass,
  # 5/5 in 5.9s against a real Postgres, Redis, uvicorn and served frontend.
  #
  # What changes with this flip: a red E2E blocks merges rather than being a
  # warning next to a green button. That is the point -- it is also why the
  # previous value existed, so read the E2E log before assuming flake.
  #
  # Unlike `test`, this needs a REAL stack: tests/conftest.py's in-memory
  # SQLite and fakeredis are in-process fixtures a browser cannot reach.
  e2e:
    name: E2E (Playwright)
    needs: test
    runs-on: ubuntu-latest
    continue-on-error: false
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: test_password, POSTGRES_DB: fintrack_e2e }
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
      redis:
        image: redis:7
        options: --health-cmd "redis-cli ping" --health-interval 10s
        ports:
          - 6379:6379
    env:
      DATABASE_URL: postgresql+asyncpg://postgres:test_password@localhost:5432/fintrack_e2e
      REDIS_URL: redis://localhost:6379
      JWT_SECRET_KEY: ${{ secrets.TEST_SECRET_KEY }}
      PYTHONPATH: ${{ github.workspace }}
      # REQUIRED. apps/api/main.py only registers CORSMiddleware when this is
      # non-empty -- unset, every browser call is CORS-blocked and the whole
      # suite goes red with nothing wrong in the code.
      CORS_ALLOWED_ORIGINS: http://localhost:5173
      # localhost everywhere, NEVER 127.0.0.1. They are different hosts and
      # therefore cross-site; the refresh cookie is SameSite=Strict, so a
      # frontend on localhost:5173 talking to an API on 127.0.0.1:8000 would
      # never store or send it and every session spec would fail invisibly.
      # Differing ports are same-site; differing hosts are not.
      E2E_BASE_URL: http://localhost:5173
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }

      - name: Install API dependencies (hash-pinned, F-12)
        run: pip install --require-hashes -r requirements.lock.txt

      - name: Create database schema
        # There is no Alembic in this repo, and Base.metadata.create_all lives
        # in a pytest fixture that a uvicorn server never runs -- against a
        # fresh Postgres service the tables would simply not exist. Mirrors
        # tests/conftest.py's test_engine fixture.
        run: |
          python - <<'PY'
          import asyncio, os
          from sqlalchemy.ext.asyncio import create_async_engine
          from apps.api.infrastructure.database.models import Base

          async def main():
              engine = create_async_engine(os.environ["DATABASE_URL"])
              async with engine.begin() as conn:
                  await conn.run_sync(Base.metadata.create_all)
              await engine.dispose()

          asyncio.run(main())
          print("schema created")
          PY

      - name: Start the API
        # Backgrounded with the log to a file, not the console: a failing E2E
        # run needs the server's side of the story, and the log is uploaded
        # below. Polls /health (apps/api/main.py) rather than sleeping blind.
        run: |
          nohup uvicorn apps.api.main:app --host localhost --port 8000 \
            > "${{ github.workspace }}/uvicorn.log" 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8000/health >/dev/null 2>&1; then
              echo "API up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "API failed to start within 60s -- log follows:"
          cat "${{ github.workspace }}/uvicorn.log"
          exit 1

      - name: Install frontend dependencies
        run: cd apps/web && npm install

      - name: Install Playwright browsers
        # --with-deps pulls the system libraries Chromium needs on a bare
        # runner. WITHOUT this the npm package is present and the browser is
        # not -- exactly the state this repo was in before FINTRACK-65:
        # installed on every run, never usable.
        run: cd apps/web && npx playwright install --with-deps chromium

      - name: Build frontend for E2E
        # The production build, not `vite dev` -- the specs should exercise
        # what actually ships. VITE_E2E_TEST_MODE enables the
        # __E2E_AUTH_STORE__ seam in main.tsx that apps/web/e2e/fixtures.ts
        # seeds auth through. That seam was silently deleted during
        # FINTRACK-60 and restored in fd7e50b; this job is what would have
        # caught it.
        run: cd apps/web && npm run build
        env:
          VITE_API_BASE_URL: http://localhost:8000
          VITE_E2E_TEST_MODE: "true"
          # REQUIRED, and deliberately fake. vite.config.ts hard-fails a
          # production build when VITE_GOOGLE_CLIENT_ID is absent (added after
          # the 2026-08-09 incident where a missing value shipped as the
          # literal `undefined` into Google's SDK). Omitting it is what failed
          # run 93981925792.
          #
          # A dummy rather than ${{ secrets.VITE_GOOGLE_CLIENT_ID }} on purpose:
          # no spec drives Google sign-in -- apps/web/e2e/fixtures.ts seeds auth
          # through the __E2E_AUTH_STORE__ seam precisely because an OAuth popup
          # is not automatable -- so the real value would never be exercised,
          # and baking a live OAuth client id into a throwaway CI build buys
          # nothing. Kept obviously-fake so it can never be mistaken for real
          # config; vite.config.ts's own comment notes that this guard checks
          # presence, not validity, and that a plausible-looking placeholder in
          # secrets once caused a live production incident.
          #
          # CONSEQUENCE, stated rather than left implicit: the Google sign-in
          # path is NOT exercised by the E2E tier. That belongs to FINTRACK-38
          # and is not covered here.
          VITE_GOOGLE_CLIENT_ID: e2e-placeholder-not-a-real-client-id.apps.googleusercontent.com

      - name: Run Playwright
        # playwright.config.ts's webServer starts `vite preview` on 5173 and
        # waits for it, so there is no separate serve step.
        run: cd apps/web && npx playwright test

      - name: Upload Allure results (E2E)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-e2e-${{ github.run_id }}
          path: allure-results/e2e
          retention-days: 30
          if-no-files-found: warn

      - name: Upload raw E2E artifacts (traces, videos, server log)
        # The full-fidelity copy. Everything the redaction step strips before
        # publication lives here instead -- access-controlled, 30-day retention.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts-${{ github.run_id }}
          path: |
            apps/web/test-results/
            e2e-results.xml
            uvicorn.log
          retention-days: 30
          if-no-files-found: ignore

  # ─── STAGE 2c: publish the Allure report (FINTRACK-65) ───────────
  # main only: Pages serves ONE site per repository, so publishing from every
  # branch would have each PR overwrite the last and destroy the trend history
  # that justifies this job. PR runs still upload results as artifacts.
  #
  # always(): a report that only appears when everything passed is useless for
  # tracking, which is the entire point of the job.
  allure-report:
    name: Publish Allure Report (GitHub Pages)
    needs: [test, e2e]
    if: always() && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      # peaceiris/actions-gh-pages pushes the gh-pages branch. This job does
      # NOT use actions/deploy-pages, so it needs neither pages: write nor
      # id-token: write nor a github-pages environment.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download API Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-api-${{ github.run_id }}
          path: allure-results/api
        continue-on-error: true

      - name: Download E2E Allure results
        uses: actions/download-artifact@v4
        with:
          name: allure-results-e2e-${{ github.run_id }}
          path: allure-results/e2e
        continue-on-error: true

      - name: REDACT results before publication (public repo)
        # THIS STEP IS LOAD-BEARING FOR SECURITY -- see ADR-018.
        #
        # This repository is public, so its Pages site is world-readable with
        # no authentication available. Playwright traces and videos capture
        # real Set-Cookie headers and bearer tokens from the run; assertion
        # messages routinely print the token they compared. The script strips
        # attachments, traces and messages at every nesting depth, keeping
        # names, status, timing and history.
        #
        # DO NOT MOVE THIS BELOW REPORT GENERATION. The generated report
        # inlines attachment content, so redacting afterwards is too late, and
        # nothing published to Pages can be unpublished.
        run: python scripts/trim_allure_results.py allure-results/api allure-results/e2e

      - name: Flatten results into one directory for generation
        # `allure generate` reads result files DIRECTLY out of each directory
        # it is given -- it does not walk subdirectories. Pointing it at
        # `allure-results/` while the files live in `allure-results/api/` and
        # `allure-results/e2e/` therefore produced a structurally valid report
        # containing ZERO tests, published green, on run 35430357202. The job
        # succeeded; the evidence it exists to publish was empty.
        #
        # Flattening after redaction, never before: only redacted files are
        # copied, so the published set can only ever be the sanitised one.
        # Result files are UUID-named, so the two suites cannot collide.
        run: |
          mkdir -p allure-results/combined
          cp -a allure-results/api/. allure-results/combined/ 2>/dev/null || true
          cp -a allure-results/e2e/. allure-results/combined/ 2>/dev/null || true
          ls -1 allure-results/combined | wc -l

      - name: Fail if there are no results to publish
        # The guard that would have caught the above on day one, and the one
        # that catches the next variant of it: a reporter writing somewhere
        # unexpected, an artifact that never uploaded, a suite that collected
        # nothing. An empty report is worse than no report -- it reads as
        # "everything is fine" on a page whose whole purpose is evidence.
        #
        # Deliberately NOT continue-on-error: this failing means the published
        # report would have been a lie.
        run: |
          count=$(find allure-results/combined -maxdepth 1 -name '*-result.json' | wc -l)
          echo "result files: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::No Allure result files found. Nothing would be published but an empty report."
            echo "Downloaded artifacts:"
            ls -R allure-results || true
            exit 1
          fi

      - name: Restore Allure history
        # Carries the previous publish's history/ forward so trend, retry and
        # flakiness charts accumulate instead of resetting to a single data
        # point every run. Without this the "tracking" half of FINTRACK-65
        # does not exist. No gh-pages branch on the very first run, hence
        # continue-on-error.
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: gh-pages-history
        continue-on-error: true

      - name: Merge history into results
        # Into the flattened directory -- the one generation actually reads.
        run: |
          if [ -d gh-pages-history/history ]; then
            cp -r gh-pages-history/history allure-results/combined/history || true
            echo "history restored"
          else
            echo "no prior history -- first published run"
          fi

      - name: Generate Allure report
        uses: simple-elf/allure-report-action@v1.15
        with:
          allure_results: allure-results/combined
          allure_history: allure-history
          keep_reports: 30

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-history

      - name: Report URL
        run: |
          {
            echo "### Allure report"
            echo "https://folioeye.github.io/finance-tracker-app/"
            echo ""
            echo "Redacted for publication (public repo, ADR-018)."
            echo "Full results: this run's \`allure-results-*\` artifacts."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── MANUAL: regenerate hash-pinned dependency lock file (F-12) ──
  # Run manually from the Actions tab (workflow_dispatch) whenever
  # apps/api/requirements.txt or requirements-test.txt changes. Runs on
  # the same Python 3.12 the app and this CI's own `test` job use --
  # generating the lock file on a mismatched interpreter risks recording
  # hashes for wheels that aren't what 3.12 actually resolves (the same
  # class of mistake as the 2026-07-03 distroless incident, just for
  # pip wheels instead of a base image). Opens no PR by itself; commits
  # requirements.lock.txt straight to whichever branch triggered it --
  # review the diff before merging that branch.
  #
  # Tick the `upgrade` input to move pins to the latest compatible versions.
  # Without it pip-compile keeps every pin already in the lock, so a plain run
  # only reacts to a real change in requirements.txt -- meaning this job could
  # never actually refresh anything. Upgrading is now a deliberate act, not a
  # side effect of pressing "Run workflow".
  generate-lock-file:
    name: Regenerate requirements.lock.txt (F-12, manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install pip-tools
        run: pip install pip-tools
      - name: Compile hash-pinned lock file
        # --no-header: see the matching note on the Verify step above -- without
        # it, this file's header would embed --output-file=requirements.lock.txt,
        # which is fine here, but keeping both compiles header-free means neither
        # side of the drift-check ever disagrees over anything but real content.
        run: |
          pip-compile --generate-hashes --allow-unsafe --no-header \
            ${{ inputs.upgrade && '--upgrade' || '' }} \
            --output-file=requirements.lock.txt \
            apps/api/requirements.txt requirements-test.txt
      - name: Commit lock file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add requirements.lock.txt
          git diff --cached --quiet || git commit -m "chore(F-12): regenerate requirements.lock.txt"
          git push
      - name: Say plainly what just happened
        # The Test Suite job in THIS run checked out the pre-regeneration
        # commit and will have failed F-12 against the old lock. That red is
        # stale. Nothing re-runs automatically because pushes made with
        # GITHUB_TOKEN do not trigger workflows, and "Re-run failed jobs"
        # re-runs the ORIGINAL commit, not the branch head -- so it fails
        # identically every time. Confirmed on runs 93979064135 and the
        # re-run after it. Without this note the run reads as "the fix
        # failed", which is the opposite of the truth.
        if: always()
        run: |
          {
            echo "### Lock file regenerated"
            echo ""
            echo "Branch: \`${{ github.ref_name }}\`"
            echo "Commit: \`$(git rev-parse --short HEAD)\`"
            echo ""
            echo "**The Test Suite result in THIS run is stale.** It checked out the"
            echo "commit from before the regeneration, so its F-12 lock check was"
            echo "reading the old file."
            echo ""
            echo "Start a NEW run against the branch head to validate the new lock:"
            echo "push to the branch, or use Run workflow. Do NOT use \"Re-run failed"
            echo "jobs\" -- that re-runs the original commit and will fail identically."
          } >> "$GITHUB_STEP_SUMMARY"

  # ─── STAGE 3: Build frontend (staging + main only) ───────────────
  build-frontend:
    name: Build Frontend
    needs: [test, detect-frontend]
    runs-on: ubuntu-latest
    if: (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main') && needs.detect-frontend.outputs.exists == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Install and build
        run: cd apps/web && npm install && npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.VITE_API_URL }} # e.g. https://api.fintrack.yourdomain.com
          VITE_GOOGLE_CLIENT_ID: ${{ secrets.VITE_GOOGLE_CLIENT_ID }}
      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with: { name: frontend-dist, path: apps/web/dist }

  # ─── STAGE 4a: Deploy to STAGING ─────────────────────────────────
  # Railway: auto-deploys apps/api from the staging branch (connected via Railway's
  # own GitHub integration -- not triggered from this workflow).
  # Frontend: FTP to Hostinger staging subdomain.
  deploy-frontend-staging:
    name: Deploy Frontend -> Staging (Hostinger)
    needs: build-frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/staging' && needs.build-frontend.result == 'success'
    environment: staging
    steps:
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: dist }
      - name: FTP deploy to Hostinger staging
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASS }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: /staging/

  # ─── STAGE 4b: Deploy to PRODUCTION ──────────────────────────────
  # environment: production -> GitHub pauses here and emails required reviewers.
  # Works on the free plan because the repo is public (see ADR-004 in the blueprint).
  # Human clicks "Approve" in the GitHub UI -> pipeline resumes.
  # Railway: auto-deploys apps/api from the main branch after merge (its own trigger).
  deploy-frontend-production:
    name: Deploy Frontend -> Production (Hostinger)
    needs: build-frontend
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && needs.build-frontend.result == 'success'
    environment: production # <- HUMAN GATE: pauses, emails reviewer, waits for approval
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with: { name: frontend-dist, path: dist }
      - name: FTP deploy to Hostinger production
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.HOSTINGER_FTP_HOST }}
          username: ${{ secrets.HOSTINGER_FTP_USER }}
          password: ${{ secrets.HOSTINGER_FTP_PASS }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: /myfintrack/
      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: "FinTrack Release ${{ github.run_number }}"
          draft: false
          prerelease: false

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- SPA fallback restore, paired with the redirect script placed in
         Hostinger hPanel's Website -> Error Pages -> 404 HTML editor (that
         page is served by Hostinger's platform for any 404, ahead of this
         app's own server config -- .htaccess-level fixes can't reach it).
         That page sends the browser to "/?redirect=<original path>"; this
         script must run and call replaceState BEFORE the deferred module
         script below boots React Router, or React Router will read the
         wrong path from window.location on its first render. Kept as a
         plain synchronous (non-module) inline script for exactly that
         ordering guarantee -- module scripts are deferred by default. -->
    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        var redirect = params.get("redirect");
        if (redirect) {
          params.delete("redirect");
          var rest = params.toString();
          history.replaceState(null, "", redirect + (rest ? "?" + rest : ""));
        }
      })();
    </script>
    <!-- Baseline CSP via meta tag (defense in depth, per constraint matrix).
         The authoritative CSP header should also be set by the hosting
         layer (Hostinger, via FINTRACK-24's Release Pro pass) since a meta
         tag can't express every directive (e.g. frame-ancestors, report-uri).

         connect-src includes %VITE_API_BASE_URL% -- Vite's built-in
         index.html env substitution (same var vite.config.ts's
         REQUIRED_BUILD_ENV_VARS guard already requires at build time) --
         because the API is a separate Railway origin, not same-origin
         with this Hostinger-hosted frontend (ADR-005). 'self' alone can
         never cover it. Found 2026-08-30: this was missing entirely, so
         every fetch() to the backend (OAuth login included) was silently
         blocked by the browser's own CSP before the request ever left the
         page -- confirmed via live console violations and zero incoming
         requests in Railway's own HTTP logs despite repeated login
         attempts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' https://accounts.google.com https://appleid.cdn-apple.com; frame-src https://accounts.google.com https://appleid.apple.com; connect-src 'self' https://accounts.google.com %VITE_API_BASE_URL%; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;"
    />
    <title>FinTrack</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
